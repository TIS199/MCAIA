# ================================================================
#   GEMINI MODELS LIST
# ================================================================
# List of Gemini models the plugin will use, in order of priority.
# The plugin will always try the top model first.
# If a rate limit (429) or high demand (503) error occurs, and
# smart-switching is enabled in config.yml, it will automatically
# fallback to the next model in this list.

models:
  - "gemini-3.8-flash"
  - "gemini-3.7-flash"
  - "gemini-3.6-flash"
  - "gemini-3.5-flash"
  - "gemini-3.5-flash-lite"
  - "gemini-3.1-flash-lite"
  - "gemini-3.0-flash"
  - "gemini-2.5-flash"
  - "gemini-2.5-flash-lite"
  - "gemini-2.0-flash"
  - "gemini-2.0-flash-lite"
