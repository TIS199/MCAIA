# ================================================================
#   MCAIA — Minecraft AI Admin Plugin
#   By TIS199  |  github.com/TIS199
#   Plugin Version: 1.2.0
# ================================================================

# ⚠️  TERMS OF SERVICE  ⚠️
# You MUST set tos-accepted to true before the plugin will work.
# By accepting, you agree that:
#   1. You are fully responsible for all AI-issued commands on your server.
#   2. The developer (TIS199) is NOT liable for any damage, data loss, or
#      player harm caused by this plugin.
#   3. You will not use this plugin to violate Mojang's EULA, harm players,
#      or break any applicable laws.
tos-accepted: false

# ================================================================
#   COMMAND NAME
# ================================================================
# Change the in-game command players type.
# Example: "ai" → /ai <prompt>   |   "ask" → /ask <prompt>
# After changing, restart your server (not just /reload).
command-name: "ai"

# ================================================================
#   AI SETTINGS
# ================================================================
ai:
  # Configure at least one hosted API key or enable Ollama with a local model.
  providers:
    gemini:
      api-key: ""
    groq:
      api-key: ""
    openai:
      api-key: ""
    anthropic:
      api-key: ""
    grok:
      api-key: ""
    openrouter:
      api-key: ""
      site-url: ""
      app-name: "MCAIA"
    ollama:
      # Local Ollama does not require an API key. Pull a model first and set its exact name below.
      enabled: false
      base-url: "http://127.0.0.1:11434"
      model: ""

  # Optional priority override. If omitted, provider-order from models.yml is used.
  # provider-order: ["ollama", "gemini", "openai", "anthropic", "grok", "openrouter"]

  # Maximum tokens (words) in the AI's response
  max-tokens: 2048

  # Creativity level (0.0 = very strict/deterministic, 1.0 = creative)
  temperature: 0.3

  # Number of conversation turns stored per player.
  # Higher = AI remembers more context but uses more tokens.
  max-history-length: 10

  # How long (seconds) to wait for a player to answer an AI follow-up question.
  query-timeout-seconds: 60

  # Maximum internal AI loop iterations per request (prevents infinite loops).
  max-iterations: 8
  
  # Try the next configured model/provider after retryable errors or invalid model IDs.
  smart-switching: true

  # Delay in server ticks to wait for command output that arrives asynchronously.
  command-output-wait-ticks: 30

# ================================================================
#   PERMISSIONS
# ================================================================
permissions:
  # If Vault or LuckPerms is NOT installed, the plugin falls back to:
  #   1. Checking if the player is OP
  #   2. Checking the permitted-players list below
  # Set to false to allow ALL players to use /ai when no perm plugin is found
  fallback-require-op: true

  # Players listed here can ALWAYS use /ai regardless of OP status
  # (only applies when no Vault/LuckPerms is detected)
  # Use exact in-game names. Bedrock players: use their name WITHOUT the . prefix.
  permitted-players:
    # - "Steve"
    # - "Alex"

  # Allow holders of mcaia.player to use /ai with their own command permissions.
  # This mode is disabled by default. mcaia.use continues to grant admin AI access.
  player-command-mode:
    enabled: false

# ================================================================
#   RATE LIMITING
# ================================================================
rate-limit:
  enabled: true
  # Seconds a player must wait between /ai requests
  cooldown-seconds: 15

# ================================================================
#   LOGGING
# ================================================================
logging:
  # Write logs to plugins/MCAIA/logs/mcaia-YYYY-MM-DD.log
  file-logging: true

  # Debug mode: prints full AI request/response JSON to console and log file.
  # WARNING: may expose sensitive config values — use only for troubleshooting.
  debug-mode: false

  # Discord webhook URL for server admin log notifications.
  # Leave empty ("") to disable. Supports action, execution, refusal, and error events.
  admin-webhook-url: ""

  # Which events trigger webhook notifications (admin webhook only).
  log-events:
    - AI_COMMAND_USED
    - COMMAND_EXECUTED
    - COMMAND_REFUSED
    - COMMAND_BLOCKED
    - ERRORS
    - RATE_LIMITED

# ================================================================
#   PLUGIN UI / MESSAGES
# ================================================================
# Chat prefix (MiniMessage format)
prefix: "<gradient:#00d2ff:#3a7bd5><b>[AI]</b></gradient> <gray>»</gray> "

# Message shown to players while the AI is processing
thinking-message: "<gray><i>🤖 AI is thinking...</i></gray>"

# ================================================================
#   GEYSER / FLOODGATE (Bedrock player support)
# ================================================================
geyser:
  # Strip the Floodgate prefix character (.) from Bedrock player names in logs.
  strip-bedrock-prefix: true

  # Allow Bedrock players (connected via Geyser + Floodgate) to use /ai.
  # Bedrock players use the same permissions as Java players.
  allow-bedrock-players: true

# ================================================================
#   WELCOME MESSAGE
# ================================================================
welcome:
  enabled: true
  message: "<yellow>Welcome, <white><player></white>! Type <aqua>/<cmd> help</aqua> for AI assistance.</yellow>"
